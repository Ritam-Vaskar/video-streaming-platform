worker_processes auto;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record all;
            record_path /opt/data/recordings;
            record_unique on;
        }

        application hls {
            live on;
            record off;

            hls on;
            hls_path /opt/data/hls;
            hls_fragment 2;
            hls_playlist_length 12;
            hls_continuous on;
            hls_cleanup on;
            hls_nested on;

            hls_variant _720p BANDWIDTH=2800000,RESOLUTION=1280x720;
            hls_variant _480p BANDWIDTH=1200000,RESOLUTION=854x480;
            hls_variant _240p BANDWIDTH=650000,RESOLUTION=426x240;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile off;

    server {
        listen 80;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /opt/data;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            expires -1;
        }

        location / {
            return 200 "RTMP/HLS server is running\n";
        }
    }
}
