services:
  rtmp:
    image: alfg/nginx-rtmp:latest
    container_name: stream-rtmp
    command: ["nginx", "-c", "/opt/nginx.conf", "-g", "daemon off;"]
    ports:
      - "1935:1935"
      - "8080:80"
    volumes:
      - ./rtmp/nginx.conf:/opt/nginx.conf:ro
      - media-data:/opt/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: stream-backend
    environment:
      - PORT=5000
      - RTMP_ABR_TARGET=rtmp://rtmp:1935/hls
      - YOUTUBE_RTMP_BASE=rtmp://a.rtmp.youtube.com/live2
      - JWT_SECRET=replace-with-strong-secret
      - USERS_FILE=/app/media/users/users.json
      - RECORDINGS_DIR=/app/media/recordings
      - HIGHLIGHTS_DIR=/app/media/highlights
      - HIGHLIGHTS_PUBLIC_BASE=http://localhost:5000/media/highlights
      - DEFAULT_BROADCASTER_EMAIL=broadcaster@pulsecast.local
      - DEFAULT_BROADCASTER_PASSWORD=Broadcaster@123
      - DEFAULT_VIEWER_EMAIL=viewer@pulsecast.local
      - DEFAULT_VIEWER_PASSWORD=Viewer@123
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - media-data:/app/media
    depends_on:
      - rtmp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
        VITE_HLS_URL: http://localhost:8080/hls
        VITE_SOCKET_URL: http://localhost:5000
    container_name: stream-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - rtmp
    restart: unless-stopped

volumes:
  media-data:
